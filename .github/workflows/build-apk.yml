name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify source files
        run: |
          test -f app/src/main/java/cn/local/questionbank/MainActivity.java
          test -f app/src/main/assets/index.html
          grep -q "pickQuestionFile" app/src/main/java/cn/local/questionbank/MainActivity.java
          grep -q "receivePickedFile" app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
          app/build/outputs/apk/debug/QuestionBankSearch-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestionBankSearch-APK
          path: app/build/outputs/apk/debug/QuestionBankSearch-debug.apk
          if-no-files-found: error
          retention-days: 30
